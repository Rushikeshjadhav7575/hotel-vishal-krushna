<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard - Hotel Vishal & Krushna</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body class="bg-light">


<!-- SECURITY -->

<script>

if (
    sessionStorage.getItem("adminLoggedIn") !== "true"
) {

    window.location.href = "admin.html";

}

</script>


<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a
            class="navbar-brand text-warning fw-bold"
            href="index.html">

            🍽 Hotel Vishal & Krushna

        </a>


        <div>

            <a
                href="index.html"
                class="btn btn-warning me-2">

                <i class="bi bi-house"></i>
                Home

            </a>


            <button
                onclick="logoutAdmin()"
                class="btn btn-danger">

                <i class="bi bi-box-arrow-right"></i>
                Logout

            </button>

        </div>

    </div>

</nav>



<!-- ================= DASHBOARD ================= -->

<div class="container py-5">


    <div class="text-center mb-5">

        <h1 class="fw-bold">

            Admin Dashboard

        </h1>

        <p class="text-muted">

            Hotel Vishal & Krushna

        </p>

    </div>



    <!-- ================= STATISTICS ================= -->

    <div class="row mb-5">


        <div class="col-md-4 mb-3">

            <div class="card shadow text-center p-4">

                <i
                    class="bi bi-cart-check fs-1 text-warning">
                </i>

                <h5 class="mt-2">
                    Food Orders
                </h5>

                <h2 id="totalOrders">
                    0
                </h2>

            </div>

        </div>
        <div class="col-md-3 mb-3">

    <div class="card shadow text-center p-4">

        <i class="bi bi-currency-rupee fs-1 text-success"></i>

        <h5 class="mt-2">
            Today's Income
        </h5>

        <h2 id="todayIncome" class="text-success">
            ₹0
        </h2>

    </div>

</div>



        <div class="col-md-4 mb-3">

            <div class="card shadow text-center p-4">

                <i
                    class="bi bi-calendar-check fs-1 text-primary">
                </i>

                <h5 class="mt-2">
                    Table Bookings
                </h5>

                <h2 id="totalTableBookings">
                    0
                </h2>

            </div>

        </div>



        <div class="col-md-4 mb-3">

            <div class="card shadow text-center p-4">

                <i
                    class="bi bi-calendar-event fs-1 text-success">
                </i>

                <h5 class="mt-2">
                    Hall Bookings
                </h5>

                <h2 id="totalHallBookings">
                    0
                </h2>

            </div>

        </div>


    </div>



    <!-- ================= FOOD ORDERS ================= -->

    <div class="card shadow mb-5">

        <div class="card-body">

            <div
                class="d-flex justify-content-between
                       align-items-center">

                <h2 class="text-warning">

                    🍽 Customer Food Orders

                </h2>


                <button
                    class="btn btn-danger"
                    onclick="clearOrders()">

                    <i class="bi bi-trash"></i>

                    Clear Orders

                </button>

            </div>


            <hr>


            <div id="ordersContainer">

                <p class="text-center">

                    No food orders yet.

                </p>

            </div>

        </div>

    </div>



    <!-- ================= TABLE BOOKINGS ================= -->

    <div class="card shadow mb-5">

        <div class="card-body">


            <div
                class="d-flex justify-content-between
                       align-items-center">

                <h2 class="text-primary">

                    🪑 Table Bookings

                </h2>


                <button
                    class="btn btn-danger"
                    onclick="clearTableBookings()">

                    <i class="bi bi-trash"></i>

                    Clear

                </button>

            </div>


            <hr>


            <div id="tableBookingsContainer">

                <p class="text-center">

                    No table bookings yet.

                </p>

            </div>


        </div>

    </div>



    <!-- ================= HALL BOOKINGS ================= -->

    <div class="card shadow mb-5">

        <div class="card-body">


            <div
                class="d-flex justify-content-between
                       align-items-center">

                <h2 class="text-success">

                    🎉 Hall Bookings

                </h2>


                <button
                    class="btn btn-danger"
                    onclick="clearHallBookings()">

                    <i class="bi bi-trash"></i>

                    Clear

                </button>

            </div>


            <hr>


            <div id="hallBookingsContainer">

                <p class="text-center">

                    No hall bookings yet.

                </p>

            </div>


        </div>

    </div>


</div>



<script src="js/admin.js"></script>


<script>

function logoutAdmin() {

    sessionStorage.removeItem(
        "adminLoggedIn"
    );

    window.location.href =
        "admin.html";

}

</script>


</body>

</html>
