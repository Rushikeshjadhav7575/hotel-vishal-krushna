<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Kitchen Login | Hotel Vishal & Krushna
    </title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #111827,
                    #1f2937,
                    #374151
                );

        }


        .login-box {

            width: 90%;

            max-width: 420px;

            padding: 35px;

            background: white;

            border-radius: 18px;

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.35);

        }


        .logo {

            text-align: center;

            font-size: 55px;

            margin-bottom: 10px;

        }


        h1 {

            text-align: center;

            color: #111827;

            margin-bottom: 5px;

        }


        .subtitle {

            text-align: center;

            color: #6b7280;

            margin-bottom: 30px;

        }


        label {

            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #374151;

        }


        input {

            width: 100%;

            padding: 13px;

            margin-bottom: 20px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            font-size: 16px;

        }


        input:focus {

            outline: none;

            border-color: #f59e0b;

            box-shadow:
                0 0 0 3px
                rgba(245, 158, 11, 0.15);

        }


        button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #f59e0b;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

        }


        button:hover {

            background: #d97706;

        }


        #loginMessage {

            text-align: center;

            margin-top: 15px;

            font-weight: bold;

        }


        .back-home {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #374151;

            text-decoration: none;

        }


        .back-home:hover {

            text-decoration: underline;

        }

    </style>

</head>


<body>


    <div class="login-box">


        <div class="logo">
            👨‍🍳
        </div>


        <h1>
            Kitchen Login
        </h1>


        <p class="subtitle">
            Hotel Vishal & Krushna
        </p>


        <form id="kitchenLoginForm">


            <label for="username">
                Username
            </label>


            <input
                type="text"
                id="username"
                placeholder="Enter kitchen username"
                required>


            <label for="password">
                Password
            </label>


            <input
                type="password"
                id="password"
                placeholder="Enter kitchen password"
                required>


            <button type="submit">

                Login to Kitchen

            </button>


        </form>


        <p id="loginMessage"></p>


        <a
            href="index.html"
            class="back-home">

            ← Back to Home

        </a>


    </div>


    <script>

        document
            .getElementById("kitchenLoginForm")
            .addEventListener(
                "submit",
                function(event) {

                    event.preventDefault();


                    const username =
                        document
                        .getElementById(
                            "username"
                        )
                        .value
                        .trim();


                    const password =
                        document
                        .getElementById(
                            "password"
                        )
                        .value;


                    /*
                     * COLLEGE PROJECT LOGIN
                     *
                     * Username:
                     * kitchen
                     *
                     * Password:
                     * kitchen123
                     */


                    if (
                        username === "kitchen" &&
                        password === "kitchen123"
                    ) {


                        sessionStorage.setItem(
                            "kitchenLoggedIn",
                            "true"
                        );


                        window.location.href =
                            "kitchen-dashboard.html";


                    } else {


                        const message =
                            document
                            .getElementById(
                                "loginMessage"
                            );


                        message.innerText =
                            "❌ Invalid username or password";


                        message.style.color =
                            "#dc2626";


                    }

                }
            );

    </script>


</body>

</html>
