<!-- BOOKING -->

<section class="py-5">

    <div class="container mt-5">

        <div class="text-center mb-5">

            <h1 class="text-warning">
                Table Booking
            </h1>

            <p>
                Reserve your table at Hotel Vishal & Krushna
            </p>

        </div>


        <div class="row justify-content-center">

            <div class="col-lg-7">


                <div class="card shadow p-4">


                    <form id="bookingForm">


                        <div class="mb-3">

                            <label class="form-label">
                                Customer Name
                            </label>

                            <input
                                type="text"
                                id="name"
                                class="form-control"
                                required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Mobile Number
                            </label>

                            <input
                                type="tel"
                                id="mobile"
                                class="form-control"
                                required>

                        </div>


                        <div class="row">


                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Booking Date
                                </label>

                                <input
                                    type="date"
                                    id="date"
                                    class="form-control"
                                    required>

                            </div>


                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Booking Time
                                </label>

                                <input
                                    type="time"
                                    id="time"
                                    class="form-control"
                                    required>

                            </div>


                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Number of Guests
                            </label>

                            <select
                                id="guests"
                                class="form-select"
                                required>

                                <option value="">
                                    Select Guests
                                </option>

                                <option>1</option>
                                <option>2</option>
                                <option>3</option>
                                <option>4</option>
                                <option>5</option>
                                <option>6</option>
                                <option>7</option>
                                <option>8</option>
                                <option>9</option>
                                <option>10+</option>

                            </select>

                        </div>


                        <button
                            type="submit"
                            class="btn btn-warning w-100">

                            <i class="bi bi-calendar-check"></i>

                            Book Table

                        </button>


                    </form>


                </div>

            </div>

        </div>

    </div>

</section>


<script>

document
.getElementById("bookingForm")
.addEventListener("submit", function(e) {

    e.preventDefault();


    const booking = {

        name:
            document.getElementById("name").value,

        mobile:
            document.getElementById("mobile").value,

        date:
            document.getElementById("date").value,

        time:
            document.getElementById("time").value,

        guests:
            document.getElementById("guests").value,

        status:
            "Pending",

        bookingId:
            "TB" + Date.now()

    };


    let bookings =
        JSON.parse(
            localStorage.getItem("tableBookings")
        ) || [];


    bookings.push(booking);


    localStorage.setItem(
        "tableBookings",
        JSON.stringify(bookings)
    );


    alert(
        "Table booked successfully! Booking ID: "
        + booking.bookingId
    );


    this.reset();

});

</script>
