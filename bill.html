<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Order Confirmation - Hotel Vishal & Krushna</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

</head>

<body class="bg-dark">


<!-- ============================= -->
<!-- CUSTOMER ORDER CONFIRMATION -->
<!-- ============================= -->

<div class="container min-vh-100 d-flex justify-content-center align-items-center">

    <div class="card shadow-lg"
         style="max-width:500px; width:100%;">

        <div class="card-body p-5 text-center">


            <!-- Restaurant -->

            <div style="font-size:50px;">
                🍽️
            </div>

            <h2 class="text-warning">
                Hotel Vishal & Krushna
            </h2>


            <!-- Success -->

            <div class="alert alert-success mt-4">

                <h4>
                    <i class="bi bi-check-circle-fill"></i>
                    Order Placed Successfully!
                </h4>

            </div>


            <!-- Order ID -->

            <p class="mt-4 mb-1 text-muted">
                Order ID
            </p>

            <h5 id="orderId">
                Loading...
            </h5>


            <hr>


            <!-- ONLY AMOUNT -->

            <p class="text-muted mb-1">
                Total Amount
            </p>

            <h1
                id="grandTotal"
                class="text-success fw-bold">

                ₹0.00

            </h1>


            <!-- PAYMENT MESSAGE -->

            <div class="alert alert-warning mt-4">

                <i class="bi bi-info-circle"></i>

                <strong>
                    Please pay the bill at the counter.
                </strong>

                <br>

                The manager will confirm your payment
                and provide the printed bill.

            </div>


            <!-- FINISH -->

            <a
                href="index.html"
                class="btn btn-warning btn-lg w-100 mt-3">

                <i class="bi bi-house"></i>

                Finish Order

            </a>


        </div>

    </div>

</div>


<script src="js/bill.js"></script>

</body>

</html>
